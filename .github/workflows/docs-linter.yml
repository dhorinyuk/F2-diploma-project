name: Docs Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/chapter2-architecture]

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run markdownlint on docs and README
        run: npx --yes markdownlint-cli2 --config .markdownlint.json "docs/**/*.md" "README.md"
